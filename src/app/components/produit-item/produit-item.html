<div class="card bloc-sombre">
  <div class="photo-produit text-center">
    <img [src]="produit().photo" [alt]="produit().nom">
  </div>
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="texte-violet categorie">{{ produit().categorie }}</span>
      <span class="badge connexion" [class.sans-fil]="produit().sansFil">
        @if (produit().sansFil) {
          Sans fil
        } @else {
          Filaire
        }
      </span>
    </div>
    <h2 class="card-title">{{ produit().nom }}</h2>
    <p class="texte-secondaire mb-3">{{ produit().marque }}</p>
    <p class="prix mb-0">{{ produit().prix | number:'1.3-3' }} <span>DT</span></p>
  </div>
</div>
