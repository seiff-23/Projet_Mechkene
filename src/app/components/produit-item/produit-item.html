<div class="card bloc-sombre" [class.produit-selectionne]="selectionne()">
  <div class="photo-produit text-center">
    <img [src]="produit().photo" [alt]="produit().nom">
  </div>
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="texte-violet categorie">{{ produit().categorie }}</span>
      <span class="badge connexion" [class.sans-fil]="produit().sansFil">
        @if (produit().sansFil) {
          Sans fil
        } @else {
          Filaire
        }
      </span>
    </div>
    <h2 class="card-title">{{ produit().nom }}</h2>
    <p class="texte-secondaire mb-3">{{ produit().marque }}</p>
    <p class="prix mb-0">{{ produit().prix | number:'1.3-3' | prixDt }}</p>
    <a class="btn btn-violet mt-3" [routerLink]="['/catalogue', produit().id]">Détails</a>
    <label class="choix-comparaison d-flex align-items-center mt-4" [class.choix-bloque]="bloque()">
      <input type="checkbox" [checked]="selectionne()" [disabled]="bloque()" (change)="onComparer()">
      <span>Comparer</span>
    </label>
  </div>
</div>
